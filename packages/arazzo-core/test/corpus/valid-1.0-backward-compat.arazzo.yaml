# valid
# A 1.0.1 document stays valid (with the 1.0 schema).
arazzo: 1.0.1
info:
  title: Legacy
  version: 1.0.0
sourceDescriptions:
  - name: petstore
    url: ./petstore.yaml
    type: openapi
workflows:
  - workflowId: findPet
    inputs:
      type: object
      properties:
        status:
          type: string
    steps:
      - stepId: find
        operationId: findPetsByStatus
        parameters:
          - name: status
            in: query
            value: $inputs.status
        successCriteria:
          - condition: $statusCode == 200
          - context: $response.body
            condition: $[0].id
            type:
              type: jsonpath
              version: draft-goessner-dispatch-jsonpath-00
        outputs:
          firstId: $response.body#/0/id
    outputs:
      firstId: $steps.find.outputs.firstId
